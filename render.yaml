services:
  - type: web
    name: airfare-apix-backend
    env: python
    buildCommand: "pip install -r requirements.txt && playwright install --with-deps chromium"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        value: "sqlite:///./apix.db"
      - key: LOG_LEVEL
        value: "INFO"
